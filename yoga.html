<div class="page">

  <div class="pageHeader">

    <button class="backButton"
            onclick="showPage('home')">
      ← Home
    </button>

    <h1>🧘 Yoga Library</h1>

    <button
  class="sheetButton"
  onclick="openSpreadsheet()"
>
  📊 Sheet
</button>

<button
  class="addButton"
  onclick="openAddYoga()"
>
  + Add
</button>

  </div>


  <!-- SEARCH & SORT -->

  <div class="listTools">

    <input
      id="yogaSearch"
      class="searchInput"
      type="text"
      placeholder="🔍 Search Yoga..."
      oninput="filterYoga()"
    >

    <select
      id="yogaSort"
      class="sortSelect"
      onchange="filterYoga()"
    >

      <option value="idAsc">
        ID ↑
      </option>

      <option value="idDesc">
        ID ↓
      </option>

      <option value="nameAsc">
        Name A-Z
      </option>

      <option value="nameDesc">
        Name Z-A
      </option>

    </select>

  </div>


  <div id="yogaList" class="cardGrid">

    <div class="loading">
      Loading Yoga...
    </div>

  </div>

</div>
