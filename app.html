<script>

================================= */

/* =================================
   SHOW PAGE
================================= */


function showPage(page) {

  /* =================================
     PAGE HTML CACHE
  ================================= */

  if (!window.pageCache) {
    window.pageCache = {};
  }


  /* =================================
     USE CACHED PAGE
  ================================= */

  if (window.pageCache[page]) {

    document.getElementById("app")
      .innerHTML =
        window.pageCache[page];


    if (page === "yoga") {

      renderYogaList(
        window.currentYoga || []
      );

    }


    if (page === "exercise") {

      renderExerciseList(
        window.currentExercises || []
      );

    }


    return;

  }


  /* =================================
     FIRST TIME LOAD
  ================================= */

  google.script.run

    .withSuccessHandler(function(html) {

      /* Save page HTML in browser */
      window.pageCache[page] = html;


      /* Show page immediately */
      document.getElementById("app")
        .innerHTML = html;


      /* Load data only first time */
      if (page === "yoga") {

        loadYoga();

      }


      if (page === "exercise") {

        loadExercises();

      }

    })

    .withFailureHandler(function(error) {

      document.getElementById("app")
        .innerHTML =
          "<div class='error'>" +
          "Unable to open page.<br>" +
          error.message +
          "</div>";

    })

    .include(page);

}

   LOAD YOGA
================================= */

          "No yoga poses found." +

}

/* =================================
   FILTER & SORT YOGA
================================= */

function filterYoga() {

  const search =
    document
      .getElementById("yogaSearch")
      .value
      .trim()
      .toLowerCase();


  const sort =
    document
      .getElementById("yogaSort")
      .value;


  let list =
    (window.currentYoga || [])
      .filter(function(item) {

        return (

          String(item.id)
            .toLowerCase()
            .includes(search)

          ||

          String(item.name)
            .toLowerCase()
            .includes(search)

        );

      });


  list.sort(function(a, b) {

    if (sort === "idAsc") {

      return compareIds(a.id, b.id);

    }


    if (sort === "idDesc") {

      return compareIds(b.id, a.id);

    }


    if (sort === "nameAsc") {

      return String(a.name)
        .localeCompare(String(b.name));

    }


    if (sort === "nameDesc") {

      return String(b.name)
        .localeCompare(String(a.name));

    }


    return 0;

  });


  renderYogaList(list);

}

    if (sort === "nameAsc") {

/* =================================
   COMPARE IDS
================================= */

function compareIds(a, b) {

  const numberA =
    parseInt(
      String(a).replace(/\D/g, ""),
      10
    ) || 0;


  const numberB =
    parseInt(
      String(b).replace(/\D/g, ""),
      10
    ) || 0;


  return numberA - numberB;

}

/* =================================
   PREVIEW IMAGE
================================= */

function previewImage() {

  const input =
    document.getElementById("imageFile");


  const preview =
    document.getElementById("imagePreview");


  if (
    !input ||
    !input.files ||
    !input.files[0]
  ) {

    preview.innerHTML = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      preview.innerHTML =

        `<img
          src="${event.target.result}"
          class="previewImage"
        >`;

    };


  reader.readAsDataURL(input.files[0]);

}

/* =================================
   SAVE EDIT
================================= */

function saveEdit(type, id) {

  const name =
    document
      .getElementById("editName")
      .value
      .trim();


  const duration =
    document
      .getElementById("editDuration")
      .value
      .trim();


  const fileInput =
    document.getElementById("imageFile");


  if (!name) {

    alert("Please enter a name.");

    return;

  }


  const oldList =
    type === "yoga"
      ? window.currentYoga
      : window.currentExercises;


  const oldItem =
    oldList.find(function(x) {

      return (
        String(x.id) ===
        String(id)
      );

    });


  const status =
    document.getElementById("uploadStatus");


  status.innerText =
    "Saving...";


  if (
    fileInput &&
    fileInput.files &&
    fileInput.files[0]
  ) {

    uploadSelectedImage(
      type,
      name,
      fileInput.files[0],
      function(fileName) {

        updateEditedRecord(
          type,
          id,
          name,
          duration,
          fileName
        );

      }
    );

  } else {

    updateEditedRecord(
      type,
      id,
      name,
      duration,
      oldItem
        ? oldItem.image
        : ""
    );

  }

}

/* =================================
   UPLOAD IMAGE
================================= */

function uploadSelectedImage(
  type,
  name,
  file,
  callback
) {

  const status =
    document.getElementById(
      "uploadStatus"
    );


  if (status) {

    status.innerText =
      "Uploading image...";

  }


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      google.script.run

        .withSuccessHandler(function(result) {

          if (status) {

            status.innerText =
              "Image uploaded successfully.";

          }


          callback(
            result.fileName
          );

        })

        .withFailureHandler(function(error) {

          if (status) {

            status.innerText = "";

          }


          alert(
            "Image upload failed:\n" +
            error.message
          );

        })

        .uploadImageToGitHub(
          type,
          name,
          event.target.result,
          file.type
        );

    };


  reader.readAsDataURL(file);

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =================================
   ESCAPE JAVASCRIPT
================================= */

function escapeJs(value) {

  return String(value || "")

    .replace(/\\/g, "\\\\")

    .replace(/'/g, "\\'")

    .replace(/"/g, '\\"');

}

/* =================================
   START ROUTINE
================================= */

function startRoutine(type) {

  stopWorkoutTimer();
  stopSessionTimer();


  /* =================================
     USE CACHED DATA
  ================================= */

  let list;


  if (type === "yoga") {

    list = window.currentYoga || [];

  } else {

    list = window.currentExercises || [];

  }


  /* =================================
     CHECK DATA
  ================================= */

  if (!list || list.length === 0) {

    alert(
      type === "yoga"
        ? "No yoga poses available."
        : "No exercises available."
    );

    return;

  }


  /* =================================
     START IMMEDIATELY
  ================================= */

  window.workout.type =
    type;


  window.workout.items =
    shuffleWorkoutItems(list);


  window.workout.currentIndex =
    0;


  window.workout.currentItem =
    null;


  window.workout.stopped =
    false;


  window.workout.paused =
    false;


  window.workout.sessionSeconds =
    0;


  startSessionTimer();


  showWorkoutScreen();


  startNextWorkoutItem();

}

/* =================================
   RANDOM ORDER
================================= */

function shuffleWorkoutItems(list) {

  const result =
    list.slice();


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    const temp =
      result[i];


    result[i] =
      result[j];


    result[j] =
      temp;

  }


  return result;

}

/* =================================
   NEXT ITEM
================================= */

function startNextWorkoutItem() {

  stopWorkoutTimer();


  if (window.workout.stopped) {

    return;

  }


  window.workout.paused =
    false;


  if (
    window.workout.currentIndex >=
    window.workout.items.length
  ) {

    window.workout.items =
      shuffleWorkoutItems(
        window.workout.items
      );


    window.workout.currentIndex =
      0;

  }


  const item =
    window.workout.items[
      window.workout.currentIndex
    ];


  window.workout.currentItem =
    item;


  const seconds =
    parseWorkoutDuration(
      item.duration
    );


  window.workout.remaining =
    seconds;


  renderWorkoutItem(
    item,
    seconds
  );


  speak(
    item.name + ". Start."
  );


  window.workout.timer =
    setInterval(function() {

      if (window.workout.paused) {

        return;

      }


      window.workout.remaining--;


      updateWorkoutTimer();


      if (
        window.workout.remaining <= 0
      ) {

        finishWorkoutItem();

      }

    }, 1000);

}


/* =================================
   DISPLAY ITEM
================================= */

function renderWorkoutItem(
  item,
  seconds
) {

  const frame =
    document.getElementById(
      "workoutFrame"
    );


  if (!frame) return;


  let imageHTML;


  if (item.image) {

    imageHTML = `

      <img
        class="workoutImage"
        src="${escapeHtml(item.image)}"
        alt="${escapeHtml(item.name)}"
      >

    `;

  } else {

    imageHTML = `

      <div class="workoutEmoji">

        ${
          window.workout.type === "yoga"
            ? "🧘"
            : "🏃"
        }

      </div>

    `;

  }


  frame.innerHTML = `

    ${imageHTML}


    <h2 class="workoutName">

      ${escapeHtml(item.name)}

    </h2>


    <div
      class="workoutStatus"
      id="workoutStatus"
    >
      START
    </div>


    <div
      class="workoutTimer"
      id="workoutTimer"
    >
      ${formatWorkoutTime(seconds)}
    </div>


    <div class="workoutProgress">

      ${
        window.workout.currentIndex + 1
      }

      /

      ${
        window.workout.items.length
      }

    </div>


    <div class="workoutActionButtons">

      <button
        id="pauseButton"
        class="pauseWorkoutButton"
        onclick="togglePauseWorkout()"
      >
        ⏸ PAUSE
      </button>


      <button
        class="skipWorkoutButton"
        onclick="skipWorkout()"
      >
        ⏭ SKIP
      </button>


      <button
        class="stopWorkoutButton"
        onclick="stopWorkout()"
      >
        ■ STOP
      </button>

    </div>

  `;

}


/* =================================
   UPDATE WORKOUT TIMER
================================= */

function updateWorkoutTimer() {

  const timer =
    document.getElementById(
      "workoutTimer"
    );


  if (timer) {

    timer.innerText =
      formatWorkoutTime(
        window.workout.remaining
      );

  }

}


/* =================================
   FINISH ITEM
================================= */

function finishWorkoutItem() {

  stopWorkoutTimer();


  const item =
    window.workout.currentItem;


  if (!item) return;


  const status =
    document.getElementById(
      "workoutStatus"
    );


  if (status) {

    status.innerText =
      "FINISHED";

  }


  speak(
    item.name + ". Finished."
  );


  showWorkoutRest();

}


/* =================================
   REST
================================= */

function showWorkoutRest() {

  if (window.workout.stopped) {

    return;

  }


  window.workout.paused =
    false;


  let seconds = 10;


  const frame =
    document.getElementById(
      "workoutFrame"
    );


  if (!frame) return;


  frame.innerHTML = `

    <div class="restScreen">

      <div class="restIcon">
        🌿
      </div>


      <h2>
        Rest
      </h2>


      <p>
        Get ready for the next one
      </p>


      <div
        id="restTimer"
        class="restTimer"
      >
        10
      </div>


      <div class="workoutActionButtons">

        <button
          id="pauseButton"
          class="pauseWorkoutButton"
          onclick="togglePauseWorkout()"
        >
          ⏸ PAUSE
        </button>


        <button
          class="skipWorkoutButton"
          onclick="skipWorkout()"
        >
          ⏭ SKIP
        </button>


        <button
          class="stopWorkoutButton"
          onclick="stopWorkout()"
        >
          ■ STOP
        </button>

      </div>

    </div>

  `;


  speak(
    "Rest for 10 seconds."
  );


  window.workout.timer =
    setInterval(function() {

      if (window.workout.paused) {

        return;

      }


      seconds--;


      const timer =
        document.getElementById(
          "restTimer"
        );


      if (timer) {

        timer.innerText =
          seconds;

      }


      if (seconds <= 0) {

        stopWorkoutTimer();


        window.workout.currentIndex++;


        startNextWorkoutItem();

      }

    }, 1000);

}


/* =================================
   PAUSE / RESUME
================================= */

function togglePauseWorkout() {

  if (window.workout.stopped) {

    return;

  }


  window.workout.paused =
    !window.workout.paused;


  const pauseButton =
    document.getElementById(
      "pauseButton"
    );


  const status =
    document.getElementById(
      "workoutStatus"
    );


  if (window.workout.paused) {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.pause();

    }


    if (pauseButton) {

      pauseButton.innerText =
        "▶ RESUME";

    }


    if (status) {

      status.innerText =
        "PAUSED";

    }

  } else {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.resume();

    }


    if (pauseButton) {

      pauseButton.innerText =
        "⏸ PAUSE";

    }


    if (status) {

      status.innerText =
        "START";

    }

  }

}


/* =================================
   VOICE CONTROL
================================= */

function toggleVoice() {

  window.workout.voiceEnabled =
    !window.workout.voiceEnabled;


  const button =
    document.getElementById(
      "voiceButton"
    );


  if (
    !window.workout.voiceEnabled
  ) {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

    }


    if (button) {

      button.innerText =
        "🔇 Voice OFF";

    }

  } else {

    if (button) {

      button.innerText =
        "🔊 Voice ON";

    }

  }

}


/* =================================
   SKIP
================================= */

function skipWorkout() {

  if (window.workout.stopped) {

    return;

  }


  stopWorkoutTimer();


  window.workout.paused =
    false;


  const item =
    window.workout.currentItem;


  if (item) {

    speak(
      item.name + ". Skipped."
    );

  }


  showWorkoutRest();

}


/* =================================
   STOP WORKOUT
================================= */

function stopWorkout() {

  stopWorkoutTimer();

  stopSessionTimer();


  window.workout.stopped =
    true;


  window.workout.paused =
    false;


  window.workout.currentItem =
    null;


  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  showPage("home");

}


/* =================================
   STOP WORKOUT TIMER
================================= */

function stopWorkoutTimer() {

  if (window.workout.timer) {

    clearInterval(
      window.workout.timer
    );

    window.workout.timer =
      null;

  }

}


/* =================================
   SESSION TIMER
================================= */

function startSessionTimer() {

  stopSessionTimer();


  window.workout.sessionSeconds =
    0;


  updateSessionTimer();


  window.workout.sessionTimer =
    setInterval(function() {

      if (window.workout.paused) {

        return;

      }


      window.workout.sessionSeconds++;


      updateSessionTimer();

    }, 1000);

}


function updateSessionTimer() {

  const element =
    document.getElementById(
      "sessionTimer"
    );


  if (!element) return;


  element.innerText =
    formatWorkoutTime(
      window.workout.sessionSeconds
    );

}


function stopSessionTimer() {

  if (
    window.workout.sessionTimer
  ) {

    clearInterval(
      window.workout.sessionTimer
    );


    window.workout.sessionTimer =
      null;

  }

}


/* =================================
   DURATION
================================= */

function parseWorkoutDuration(value) {

  const text =
    String(value || "")
      .toLowerCase()
      .trim();


  const number =
    parseFloat(text);


  if (
    !number ||
    number <= 0
  ) {

    return 30;

  }


  if (
    text.includes("min") ||
    text.includes("minute")
  ) {

    return Math.round(
      number * 60
    );

  }


  return Math.round(number);

}


/* =================================
   FORMAT TIME
================================= */

function formatWorkoutTime(seconds) {

  seconds =
    Math.max(
      0,
      Number(seconds) || 0
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (

    String(minutes)
      .padStart(2, "0")

    +

    ":"

    +

    String(secs)
      .padStart(2, "0")

  );

}


/* =================================
   VOICE
================================= */

function speak(text) {

  if (!window.workout.voiceEnabled) {

    return;

  }


  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.rate = 0.9;

  speech.pitch = 1;

  speech.volume = 1;


  window.speechSynthesis.speak(
    speech
  );

}

</script>
