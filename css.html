<style>

* {
  box-sizing: border-box;
}


body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #111;
}


/* ================================
   HOME
================================ */

.home {
  min-height: 100vh;
  padding-bottom: 40px;
}


.homeHeader {
  background: #2e7d32;
  color: white;
  text-align: center;
  padding: 35px 20px 45px;
  border-radius: 0 0 30px 30px;
}


.logo {
  font-size: 42px;
}


.homeHeader h1 {
  margin: 5px 0;
  font-size: 34px;
}


.homeHeader p {
  margin: 10px 0 0;
  font-size: 17px;
}


.homeCards {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 20px;

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}


.homeCard {
  background: white;
  border-radius: 20px;
  padding: 35px 20px;
  text-align: center;
  cursor: pointer;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.08);

  transition:
    transform 0.2s,
    box-shadow 0.2s;
}


.homeCard:hover {
  transform: translateY(-4px);

  box-shadow:
    0 8px 25px rgba(0,0,0,0.12);
}


.cardIcon {
  font-size: 50px;
  margin-bottom: 15px;
}


.cardTitle {
  font-size: 22px;
  font-weight: bold;
}


.cardText {
  margin-top: 8px;
  color: #666;
}


/* ================================
   PAGE
================================ */

.page {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}


.pageHeader {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
}


.pageHeader h1 {
  flex: 1;
  margin: 0;
  font-size: 30px;
}


/* ================================
   BUTTONS
================================ */

.backButton,
.startButton,
.addButton {
  border: none;
  border-radius: 10px;

  padding: 11px 18px;

  font-size: 15px;

  cursor: pointer;

  white-space: nowrap;
}


.backButton {
  background: #198754;
  color: white;
}


.startButton {
  background: #2e7d32;
  color: white;
  font-weight: bold;
}


.addButton {
  background: #198754;
  color: white;
  font-weight: bold;
}


.backButton:hover,
.startButton:hover,
.addButton:hover {
  opacity: 0.9;
}


/* ================================
   LIST
================================ */

.cardGrid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 22px;
}


.itemCard {
  position: relative;

  background: white;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 5px 18px rgba(0,0,0,0.08);
}


.itemImage {
  width: 100%;
  height: 210px;

  background: #eef3ef;

  display: flex;

  align-items: center;

  justify-content: center;
}


.itemImage img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}


.noImage {
  font-size: 60px;
}


.itemInfo {
  padding: 18px;
}


.itemId {
  font-size: 12px;
  color: #777;

  margin-bottom: 6px;

  font-weight: 600;
}


.itemInfo h2 {
  margin: 0 0 10px;

  font-size: 20px;
}


.duration {
  color: #666;

  font-size: 15px;
}


/* ================================
   EDIT BUTTON
================================ */

.editButton {
  position: absolute;

  top: 12px;
  right: 12px;

  width: 38px;
  height: 38px;

  border: none;

  border-radius: 50%;

  background: white;

  cursor: pointer;

  font-size: 18px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.15);
}


.editButton:hover {
  transform: scale(1.05);
}


/* ================================
   MESSAGES
================================ */

.loading,
.empty,
.error {
  text-align: center;

  padding: 50px;

  font-size: 18px;
}


.error {
  color: #c62828;
}


/* ================================
   EDITOR
================================ */

.editor {
  max-width: 600px;

  margin: 30px auto;

  background: white;

  padding: 30px;

  border-radius: 18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.08);
}


.editor label {
  display: block;

  margin-top: 18px;
  margin-bottom: 7px;

  font-weight: bold;
}


.editor input {
  width: 100%;

  padding: 12px;

  border: 1px solid #ddd;

  border-radius: 8px;

  font-size: 16px;
}


.editor input:focus {
  outline: none;

  border-color: #198754;
}


/* ================================
   ID
================================ */

.currentId {
  font-size: 14px;

  color: #666;

  background: #f4f7f5;

  padding: 10px;

  border-radius: 8px;

  margin-bottom: 15px;

  font-weight: bold;
}


/* ================================
   IMAGE PREVIEW
================================ */

.currentImage {
  width: 100%;

  height: 180px;

  margin-top: 5px;

  background: #eef3ef;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}


.imagePreview {
  margin-top: 12px;

  display: flex;

  justify-content: center;
}


.previewImage {
  max-width: 100%;

  max-height: 180px;

  border-radius: 10px;

  object-fit: contain;
}


/* ================================
   EDITOR BUTTONS
================================ */

.editorButtons {
  display: flex;

  gap: 12px;

  margin-top: 25px;

  flex-wrap: wrap;
}


.saveButton,
.deleteButton,
.cancelButton {
  border: none;

  padding: 12px 22px;

  border-radius: 8px;

  color: white;

  cursor: pointer;

  font-weight: bold;
}


.saveButton {
  background: #198754;
}


.deleteButton {
  background: #c62828;
}


.cancelButton {
  background: #777;
}


.saveButton:hover,
.deleteButton:hover,
.cancelButton:hover {
  opacity: 0.9;
}


/* ================================
   UPLOAD STATUS
================================ */

.uploadStatus {
  margin-top: 10px;

  font-size: 14px;

  color: #198754;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

  .homeCards {
    grid-template-columns: 1fr;
  }


  .cardGrid {
    grid-template-columns: 1fr;
  }


  .pageHeader {
    flex-wrap: wrap;
  }


  .pageHeader h1 {
    width: 100%;

    order: 2;

    flex: auto;

    font-size: 25px;
  }


  .backButton {
    order: 1;
  }


  .addButton {
    order: 3;
  }


  .startButton {
    order: 4;
  }


  .page {
    padding: 15px;
  }


  .editor {
    padding: 20px;
  }

}


/* ================================
   SMALL MOBILE
================================ */

@media (max-width: 450px) {

  .homeHeader h1 {
    font-size: 28px;
  }


  .logo {
    font-size: 36px;
  }


  .pageHeader {
    gap: 8px;
  }


  .backButton,
  .startButton,
  .addButton {
    padding: 9px 12px;

    font-size: 13px;
  }

}

/* ================================
   SEARCH & SORT
================================ */

.listTools {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
}

.searchInput {
  flex: 1;

  padding: 12px 15px;

  border: 1px solid #ddd;

  border-radius: 10px;

  font-size: 16px;

  background: white;
}

.sortSelect {
  width: 150px;

  padding: 12px;

  border: 1px solid #ddd;

  border-radius: 10px;

  font-size: 15px;

  background: white;

  cursor: pointer;
}

.searchInput:focus,
.sortSelect:focus {
  outline: none;
  border-color: #198754;
}


@media (max-width: 700px) {

  .listTools {
    flex-direction: column;
  }

  .sortSelect {
    width: 100%;
  }

}

/* =================================
   HOME START BUTTONS
================================= */

.homeCardButtons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.viewButton,
.routineButton {
  border: none;
  border-radius: 10px;
  padding: 11px 18px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.viewButton {
  background: #e8f5e9;
  color: #198754;
}

.routineButton {
  background: #2e7d32;
  color: white;
}


/* =================================
   WORKOUT
================================= */

.workoutPage {
  min-height: 100vh;
  padding: 20px;
  background: #f4f7f5;
}

.workoutHeader {
  max-width: 800px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.workoutHeader h1 {
  flex: 1;
  margin: 0;
  font-size: 28px;
}

.workoutFrame {
  max-width: 700px;
  margin: auto;
  background: white;
  border-radius: 25px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

.workoutImage {
  width: 100%;
  max-width: 450px;
  height: 320px;
  object-fit: contain;
  border-radius: 18px;
  background: #eef3ef;
}

.workoutEmoji {
  width: 100%;
  max-width: 450px;
  height: 320px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef3ef;
  border-radius: 18px;
  font-size: 100px;
}

.workoutName {
  margin: 20px 0 5px;

}

.workoutStatus {
  font-size: 20px;
  font-weight: bold;
  color: #198754;
}

.workoutTimer {
  font-size: 70px;
  font-weight: bold;
  margin: 15px 0;
}

.workoutProgress {
  color: #777;
  margin-bottom: 20px;
}

.stopWorkoutButton {
  border: none;
  background: #c62828;
  color: white;
  padding: 14px 35px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.restScreen {
  padding: 50px 20px;
}

.restIcon {
  font-size: 70px;
}

.restTimer {
  font-size: 70px;
  font-weight: bold;
  color: #198754;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 700px) {

  .workoutPage {
    padding: 12px;
  }

  .workoutFrame {
    padding: 15px;
  }

  .workoutImage,
  .workoutEmoji {
    height: 240px;
  }

  .workoutName {
    font-size: 26px;
  }

  .workoutTimer,
  .restTimer {
    font-size: 55px;
  }

}

/* =================================
   SESSION TIMER
================================= */

.sessionTimerDisplay {
  background: white;
  padding: 9px 14px;
  border-radius: 10px;
  font-weight: bold;
  color: #198754;
  white-space: nowrap;
}


/* =================================
   WORKOUT ACTION BUTTONS
================================= */

.workoutActionButtons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 5px;
}


.skipWorkoutButton {
  border: none;
  background: #777;
  color: white;
  padding: 14px 30px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}


.skipWorkoutButton:hover {
  opacity: 0.9;
}


@media (max-width: 700px) {

  .sessionTimerDisplay {
    font-size: 13px;
    padding: 8px 10px;
  }

  .workoutActionButtons {
    flex-direction: column;
  }

  .skipWorkoutButton,
  .stopWorkoutButton {
    width: 100%;
  }

}

/* =================================
   WORKOUT CONTROLS
================================= */

.workoutControlsTop {
  display: flex;
  justify-content: center;
  margin-bottom: 15px;
}

.voiceButton,
.pauseWorkoutButton,
.skipWorkoutButton,
.stopWorkoutButton {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.voiceButton {
  background: #198754;
  color: white;
}

.pauseWorkoutButton {
  background: #e0a800;
  color: white;
}

.skipWorkoutButton {
  background: #777;
  color: white;
}

.stopWorkoutButton {
  background: #c62828;
  color: white;
}

.workoutActionButtons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.sessionTimerDisplay {
  background: white;
  color: #198754;
  padding: 9px 14px;
  border-radius: 10px;
  font-weight: bold;
  white-space: nowrap;
}

@media (max-width: 600px) {

  .workoutActionButtons {
    flex-direction: column;
  }

  .voiceButton,
  .pauseWorkoutButton,
  .skipWorkoutButton,
  .stopWorkoutButton {
    width: 100%;
  }

}
